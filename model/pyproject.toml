[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
ml = ["torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
