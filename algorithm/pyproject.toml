[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-algorithm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["grid-model>=0.1.0", "pyserial>=3.5"]

[project.optional-dependencies]
ui = ["streamlit>=1.37", "plotly>=5"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
